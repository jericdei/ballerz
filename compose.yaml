services:
  postgres:
    image: postgres:18
    container_name: ballerz-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ballerz
      POSTGRES_PASSWORD: ballerz
      POSTGRES_DB: ballerz
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballerz -d ballerz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
